name: Deploy to Vercel

on:
  push:
    branches:
      - arena/3a471d5d-htech
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "## Vercel deployment diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing from repository secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "VERCEL_TOKEN is present (length ${#VERCEL_TOKEN})." >> "$GITHUB_STEP_SUMMARY"
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" >> "$GITHUB_STEP_SUMMARY" 2>&1

      - name: Deploy static site to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          npx --yes vercel@latest deploy --prod --yes --no-color > deploy-output.log 2>&1
          status=$?
          echo "### Deploy output" >> "$GITHUB_STEP_SUMMARY"
          cat deploy-output.log >> "$GITHUB_STEP_SUMMARY"
          exit $status
